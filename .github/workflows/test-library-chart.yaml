name: test-library-chart

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      # yq (mikefarah) is preinstalled on GitHub-hosted ubuntu runners; verify it.
      - name: Check yq
        run: yq --version

      - name: Render and verify document separators
        run: ./test/verify.sh
